name: Deploy Apache Iggy Website

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # prebuild fetches the GitHub star count into src/github-stars.json, which
      # is gitignored and so absent on a fresh checkout. Without a token the
      # anonymous API limit (per runner IP) is routinely exhausted and the
      # script silently ships its hardcoded fallback instead.
      - name: Build Website
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy ASF config
        run: |
          cp .asf.yaml ./out/.asf.yaml
          cp .htaccess ./out/.htaccess

      - name: Publish Iggy Website to asf-site
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: asf-site
          publish_dir: ./out
          destination_dir: ./
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy website from main branch"
