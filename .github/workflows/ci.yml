name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # pretypecheck generates src/github-stars.json, which is gitignored and so
      # absent on a fresh checkout. GITHUB_TOKEN lifts the anonymous API limit;
      # the script falls back safely if the fetch fails.
      - name: Typecheck
        run: npm run typecheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check docs links
        run: npm run check:links

      - name: Check licence headers
        run: npm run check:headers

      - name: Validate .asf.yaml
        run: >-
          python3 -c "import sys,yaml; yaml.safe_load(open('.asf.yaml'));
          print('.asf.yaml parses')"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Website
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
